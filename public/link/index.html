<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<title>Link Generator</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --sep: rgba(60,60,67,.16);
    --label: #000; --label-2: rgba(60,60,67,.62); --label-3: rgba(60,60,67,.35);
    --fill: rgba(118,118,128,.12); --accent: #57068c; --accent-tint: #f2e9f9; --green: #30a14e;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--label); font: 17px/1.42 var(--font); letter-spacing: -.01em; }
  button, select, input { font: inherit; letter-spacing: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  .wrap { width: 100%; }
  .topbar { flex: none; background: rgba(242,242,247,.82); border-bottom: .5px solid var(--sep); padding-top: env(safe-area-inset-top); }
  .topbar .wrap { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 58px; padding-top: 6px; padding-bottom: 6px; }
  .back { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 2px; color: var(--accent); text-decoration: none; font-size: 17px; padding: 6px 8px 6px 0; }
  .back svg { width: 22px; height: 22px; }
  .tr-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .tr-sub { font-size: 13px; color: var(--label-2); }

  main.wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; padding-bottom: calc(env(safe-area-inset-bottom) + 10px); }
  .group { flex: none; background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .form-row { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 44px; }
  .form-row + .form-row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .form-row label { flex: none; width: 112px; font-weight: 500; }
  .form-row select, .form-row input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 17px; color: var(--accent); text-align: right; text-align-last: right; padding: 9px 0; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .form-row select:disabled { color: var(--label-3); cursor: default; }
  .form-row input[type="date"] { min-height: 40px; }
  .form-row input::-webkit-date-and-time-value { text-align: right; }
  .foot { flex: none; font-size: 13px; color: var(--label-2); margin: 0 16px; display: flex; gap: 6px; align-items: center; }
  .foot svg { width: 14px; height: 14px; flex: none; }

  .qr-card { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; background: var(--card); border-radius: var(--radius); padding: 12px 14px 14px; text-align: center; }
  .qr { flex: 1; min-height: 110px; width: 100%; display: flex; justify-content: center; }
  .qr { align-items: center; }
  .qr svg { height: 100%; width: auto; max-width: 100%; max-height: 190px; aspect-ratio: 1; display: block; }
  .qr-sum { font-weight: 600; font-size: 15px; margin: 8px 0 0; line-height: 1.3; }
  .qr-cap { font-size: 13px; color: var(--label-2); margin: 2px 0 0; }
  .url { width: 100%; font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--bg); border-radius: 8px; padding: 6px 10px; margin: 8px 0; }
  .actions { width: 100%; display: flex; gap: 10px; }
  .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 16px; font-size: 17px; font-weight: 600; background: var(--accent); color: #fff; cursor: pointer; }
  .btn.plain { background: var(--fill); color: var(--accent); }
  .btn.ok { background: var(--green); }
  #copy { flex: 1.7; white-space: nowrap; }
  /* Netlify adds a "Powered by Netlify" badge to every page on the free plan; keep it hidden */
  #nl-badge-frame { display: none !important; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="back" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</a>
    <div class="tr-title">For clinic staff</div><div class="tr-sub">Link Generator</div>
  </div>
</header>

<main class="wrap">
  <div class="group">
    <div class="form-row"><label for="fSurgeon">Surgeon</label><select id="fSurgeon"></select></div>
    <div class="form-row"><label for="fArea">Body area</label><select id="fArea"></select></div>
    <div class="form-row"><label for="fProc">Surgery</label><select id="fProc"></select></div>
    <div class="form-row"><label for="fStudy">Studies</label><select id="fStudy"></select></div>
    <div class="form-row"><label for="fDate">Surgery date</label><input type="date" id="fDate"></div>
  </div>
  <div class="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Never add the patient’s name.</span></div>

  <div class="qr-card">
    <div class="qr" id="qr" role="img" aria-label="QR code for the patient’s surgery guide"></div>
    <p class="qr-sum" id="sum"></p>
    <p class="qr-cap">The patient scans this with their phone camera.</p>
    <div class="url" id="url"></div>
    <div class="actions">
      <button class="btn plain" type="button" id="reset">Clear</button>
      <button class="btn" type="button" id="copy"></button>
    </div>
  </div>

</main>

<script src="/catalog.js"></script>
<script src="/link/qrcode.js"></script>
<script>
const $ = id => document.getElementById(id);
const fS = $('fSurgeon'), fA = $('fArea'), fP = $('fProc'), fSt = $('fStudy'), fD = $('fDate');
const opts = (list, none = 'Not set') => `<option value="">${none}</option>` + list.map(([k, v]) => `<option value="${k}">${v.label || v.name}</option>`).join('');
fS.innerHTML = opts(Object.entries(SURGEONS));
fA.innerHTML = opts(Object.entries(AREAS));

// Surgery and study lists follow the body area.
function fillAreaLists() {
  const p = fP.value, st = fSt.value;
  fP.innerHTML = opts(procsFor(fA.value));
  fP.value = procsFor(fA.value).some(([k]) => k === p) ? p : '';
  const studies = studiesFor(fA.value);
  fSt.innerHTML = opts(studies, studies.length ? 'None' : 'None available');
  fSt.value = studies.some(([k]) => k === st) ? st : '';
  fSt.disabled = !studies.length;
}

// The patient guide lives at the site root of wherever this page is hosted.
function link() {
  const d = cleanDetails({ s: fS.value, a: fA.value, p: fP.value, st: fSt.value, d: fD.value });
  const q = new URLSearchParams();
  for (const k of LINK_KEYS) if (d[k]) q.set(k, d[k]);
  return location.origin + '/' + (q.toString() ? '?' + q : '');
}

function update() {
  const url = link();
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  $('url').textContent = url;
  const date = fD.value ? new Date(fD.value + 'T12:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const parts = [fS.value && SURGEONS[fS.value].name, fP.value ? PROCEDURES[fP.value].label : fA.value && AREAS[fA.value].label + ' surgery', fSt.value && STUDIES[fSt.value].label, date].filter(Boolean);
  $('sum').textContent = parts.length ? parts.join(' · ') : 'No details yet. The patient will be asked to add them.';
  const c = $('copy'); c.innerHTML = CAN_SHARE ? SHARE_ICON + 'Share via AirDrop' : 'Copy link'; c.classList.remove('ok');
}

// iPhones (and most phones) open the share sheet, which includes AirDrop, Messages and Mail.
// Browsers without it fall back to copying the link.
const CAN_SHARE = !!navigator.share;
const SHARE_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.88 14.12A3 3 0 1 1 14.12 14.12"/><path d="M7.4 16.6A6.5 6.5 0 1 1 16.6 16.6"/><path d="M4.93 19.07A10 10 0 1 1 19.07 19.07"/></svg>';

fA.addEventListener('input', () => { fillAreaLists(); update(); });
fP.addEventListener('input', () => { if (fP.value && !fA.value) { fA.value = PROCEDURES[fP.value].area; fillAreaLists(); } update(); });
[fS, fSt, fD].forEach(x => x.addEventListener('input', update));
fD.addEventListener('change', update);

$('copy').addEventListener('click', async e => {
  if (CAN_SHARE) {
    try { await navigator.share({ title: 'Your surgery guide', url: link() }); }
    catch (err) { if (err.name !== 'AbortError') prompt('Copy this link:', link()); }
    return;
  }
  try { await navigator.clipboard.writeText(link()); e.currentTarget.textContent = 'Copied'; e.currentTarget.classList.add('ok'); }
  catch { prompt('Copy this link:', link()); }
});
$('reset').addEventListener('click', () => {
  fS.value = ''; fA.value = ''; fD.value = ''; fillAreaLists(); update();
});

// Start with the only surgeon and area selected, since there's just one of each for now.
if (Object.keys(SURGEONS).length === 1) fS.value = Object.keys(SURGEONS)[0];
if (Object.keys(AREAS).length === 1) fA.value = Object.keys(AREAS)[0];
fillAreaLists();
update();
</script>
</body>
</html>
