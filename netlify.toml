[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

# The clinic staff QR Code Generator lives at /QR. Lowercase and the old /link address lead there too.
[[redirects]]
  from = "/qr"
  to = "/QR/"
  status = 301

[[redirects]]
  from = "/link"
  to = "/QR/"
  status = 301

[[redirects]]
  from = "/link/*"
  to = "/QR/"
  status = 301
